<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Диафонд Архив — Советские диафильмы в ИИ-реставрации</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #12100e; color: #f5ebe0; font-family: system-ui, -apple-system, sans-serif; }
    .film-card { background: #1c1917; border: 1px solid #292524; transition: transform 0.2s, border-color 0.2s; }
    .film-card:hover { transform: translateY(-2px); border-color: #d97706; }
    .frame-box { aspect-ratio: 4/3; background: #090807; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #44403c; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ШАПКА -->
  <header class="sticky top-0 z-30 bg-[#1c1917]/95 backdrop-blur border-b border-stone-800 px-4 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 cursor-pointer" onclick="closePlayer()">
        <span class="text-2xl">🎞️</span>
        <div>
          <h1 class="font-bold text-lg leading-tight text-amber-400">ДИАФОНД АРХИВ</h1>
          <p class="text-xs text-stone-400">Цифровая реставрация диафильмов</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="adminToggleBtn" onclick="toggleAdminMode()" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-stone-800 hover:bg-stone-700 text-stone-300 border border-stone-700">
          ⚙️ Управление
        </button>
      </div>
    </div>
  </header>

  <!-- ПАНЕЛЬ ФИЛЬТРОВ И ПОИСКА (КАТАЛОГ) -->
  <main id="catalogView" class="flex-1 max-w-7xl w-full mx-auto p-4">
    
    <!-- АДМИН-ВКЛАДКИ СТАТУСОВ (Видны только в режиме управления) -->
    <div id="adminStatusTabs" class="hidden mb-4 p-3 rounded-xl bg-stone-900 border border-amber-500/30">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold uppercase tracking-wider text-amber-400">🛠️ Режим администратора (все 244 ленты)</span>
        <button onclick="logoutAdmin()" class="text-xs text-red-400 hover:underline">Выйти из админки</button>
      </div>
      <div id="statusButtons" class="flex flex-wrap gap-1.5"></div>
    </div>

    <!-- ПОИСК -->
    <div class="flex flex-wrap gap-2 mb-5">
      <input id="searchInput" type="text" oninput="renderCatalog()" placeholder="Поиск по названию, художнику, году..." 
        class="flex-1 min-w-[220px] bg-stone-900 border border-stone-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500" />
      <select id="studioFilter" onchange="renderCatalog()" class="bg-stone-900 border border-stone-700 rounded-xl px-3 py-2.5 text-sm">
        <option value="">Все студии</option>
      </select>
    </div>

    <!-- СЧЕТЧИК И СЕТКА -->
    <div id="catalogStatusText" class="text-xs text-stone-400 mb-3">Загрузка архива...</div>
    <div id="filmsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  </main>

  <!-- ПРОСМОТРЩИК / ПЛЕЕР И РЕДАКТОР ДИАФИЛЬМА -->
  <section id="playerView" class="hidden flex-1 max-w-5xl w-full mx-auto p-3 sm:p-5">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <button onclick="closePlayer()" class="px-3 py-1.5 rounded-lg bg-stone-800 hover:bg-stone-700 text-sm flex items-center gap-1">
        ← Назад в каталог
      </button>

      <!-- Переключатели Оригинал / Реставрация / Движок -->
      <div class="flex flex-wrap items-center gap-2">
        <div class="inline-flex rounded-lg bg-stone-900 p-1 border border-stone-700">
          <button id="btnModeRestored" onclick="setViewMode('restored')" class="px-3 py-1 rounded-md text-xs font-semibold bg-amber-600 text-white">
            ✨ Реставрация
          </button>
          <button id="btnModeOriginal" onclick="setViewMode('original')" class="px-3 py-1 rounded-md text-xs font-semibold text-stone-400">
            📜 Оригинал
          </button>
        </div>

        <select id="engineSelect" onchange="updatePlayerFrame()" class="bg-stone-900 border border-stone-700 rounded-lg px-2.5 py-1.5 text-xs">
          <option value="auto">Авто (Лучшая)</option>
          <option value="nanobanana">Gemini 3.1 (NanoBanana)</option>
          <option value="flux2">FLUX.2</option>
          <option value="upscaled">Upscaled</option>
        </select>
      </div>
    </div>

    <!-- ЗАГОЛОВОК ЛЕНТЫ -->
    <div class="mb-3">
      <h2 id="playerTitle" class="text-xl sm:text-2xl font-bold text-amber-400"></h2>
      <p id="playerMeta" class="text-xs text-stone-400 mt-0.5"></p>
    </div>

    <!-- ЭКРАН ПРОЕКТОРА -->
    <div class="relative rounded-2xl overflow-hidden border border-stone-800 bg-black shadow-2xl">
      <div class="frame-box w-full flex items-center justify-center relative select-none">
        <img id="playerImg" src="" alt="Кадр диафильма" class="max-h-[72vh] w-auto object-contain mx-auto" />
        
        <!-- Зоны клика/тапа влево и вправо -->
        <button onclick="prevFrame()" class="absolute left-0 top-0 bottom-0 w-1/5 flex items-center justify-start pl-3 opacity-0 hover:opacity-100 transition-opacity bg-gradient-to-r from-black/50 to-transparent text-2xl">
          ❮
        </button>
        <button onclick="nextFrame()" class="absolute right-0 top-0 bottom-0 w-1/5 flex items-center justify-end pr-3 opacity-0 hover:opacity-100 transition-opacity bg-gradient-to-l from-black/50 to-transparent text-2xl">
          ❯
        </button>
      </div>

      <!-- Нижняя панель проектора -->
      <div class="bg-stone-900/95 px-4 py-3 border-t border-stone-800 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <button onclick="prevFrame()" class="px-3 py-1.5 rounded-lg bg-stone-800 hover:bg-stone-700 text-sm">◀ Пред.</button>
          <span id="frameCounter" class="text-sm font-mono px-2">0 / 0</span>
          <button onclick="nextFrame()" class="px-3 py-1.5 rounded-lg bg-stone-800 hover:bg-stone-700 text-sm">След. ▶</button>
        </div>

        <div id="frameBadge" class="text-xs text-stone-400"></div>

        <!-- Быстрые кнопки Админа для текущего кадра -->
        <div id="adminFrameActions" class="hidden flex flex-wrap items-center gap-2">
          <button onclick="setCurrentFrameAsCover()" class="px-2.5 py-1 rounded bg-amber-600/20 border border-amber-500/40 text-amber-300 text-xs hover:bg-amber-600/30">
            🖼️ Сделать обложкой (f_000)
          </button>
          <button onclick="toggleCurrentFrameActive()" class="px-2.5 py-1 rounded bg-stone-800 border border-stone-700 text-stone-300 text-xs hover:bg-stone-700">
            👁️ Скрыть/показать кадр
          </button>
        </div>
      </div>
    </div>

    <!-- МИНИАТЮРЫ ВСЕХ КАДРОВ ВНИЗУ -->
    <div id="thumbsStrip" class="flex gap-2 overflow-x-auto py-3 mt-2"></div>

    <!-- ПАНЕЛЬ РЕДАКТИРОВАНИЯ ДИАФИЛЬМА (ТОЛЬКО ДЛЯ АДМИНА) -->
    <div id="adminFilmEditor" class="hidden mt-6 p-4 rounded-2xl bg-stone-900 border border-amber-500/40 space-y-3">
      <h3 class="font-bold text-sm text-amber-400">🛠️ Управление диафильмом в Supabase</h3>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="text-xs text-stone-400">Статус ленты:</label>
          <select id="editStatus" class="w-full mt-1 bg-stone-950 border border-stone-700 rounded-lg px-3 py-2 text-sm">
            <option value="restored_paid">restored_paid (Опубликован)</option>
            <option value="waiting_approval">waiting_approval (На проверке)</option>
            <option value="ready_ai">ready_ai (Готов к ИИ)</option>
            <option value="downloaded">downloaded (Скачан оригинал)</option>
            <option value="pending">pending (В очереди)</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-stone-400">Художник:</label>
          <input id="editArtist" type="text" class="w-full mt-1 bg-stone-950 border border-stone-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="text-xs text-stone-400">Год выпуска:</label>
          <input id="editYear" type="number" class="w-full mt-1 bg-stone-950 border border-stone-700 rounded-lg px-3 py-2 text-sm" />
        </div>
      </div>
      <div>
        <label class="text-xs text-stone-400">Индивидуальный промпт для ИИ (custom_prompt):</label>
        <textarea id="editCustomPrompt" rows="2" class="w-full mt-1 bg-stone-950 border border-stone-700 rounded-lg px-3 py-2 text-sm" placeholder="Например: Puppet filmstrip, warm studio lighting..."></textarea>
      </div>
      <div class="flex items-center justify-between pt-2">
        <a id="editOriginalLink" href="#" target="_blank" class="text-xs text-amber-400 hover:underline">🔗 Открыть источник на diafilmy.su</a>
        <button onclick="saveFilmChanges()" class="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold">
          💾 Сохранить изменения в БД
        </button>
      </div>
    </div>
  </section>

  <script>
    // =========================================================================
    // НАСТРОЙКИ SUPABASE
    // =========================================================================
    const SUPABASE_URL = "https://ppzbqkexgbcejgvazhlb.supabase.co";
    // Сюда можно вставить ваш публичный anon key из Supabase -> Project Settings -> API
    // Если оставить пустым, сайт попросит ввести ваш ключ один раз и сохранит в телефоне
    const PUBLIC_ANON_KEY = "";

    let isAdmin = localStorage.getItem("diafond_admin_mode") === "1";
    let adminStatusFilter = "PUBLIC"; 
    let allFilms = [];
    let coversMap = {}; // film_id -> cover_url
    let currentFilm = null;
    let currentFrames = [];
    let currentFrameIdx = 0;
    let viewMode = "restored"; // 'restored' | 'original'

    function getActiveApiKey() {
      const savedKey = localStorage.getItem("diafond_sb_key");
      return savedKey || PUBLIC_ANON_KEY;
    }

    async function sbFetch(path, options = {}) {
      const key = getActiveApiKey();
      if (!key) {
        promptForKey();
        throw new Error("Ключ API не задан");
      }
      const headers = {
        "apikey": key,
        "Authorization": `Bearer ${key}`,
        "Content-Type": "application/json",
        ...(options.headers || {})
      };
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...options, headers });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Ошибка БД (${res.status}): ${txt}`);
      }
      return res.status === 204 ? null : await res.json();
    }

    function promptForKey() {
      const k = prompt("Введите ваш ключ Supabase (Anon или Service Role Key).\nОн сохранится в памяти браузера телефона:");
      if (k && k.trim()) {
        localStorage.setItem("diafond_sb_key", k.trim());
        location.reload();
      }
    }

    function toggleAdminMode() {
      if (!isAdmin) {
        const key = localStorage.getItem("diafond_sb_key");
        if (!key) {
          const k = prompt("Для входа в режим Управления введите ваш Supabase Service Role Key:");
          if (!k || !k.trim()) return;
          localStorage.setItem("diafond_sb_key", k.trim());
        }
        isAdmin = true;
        localStorage.setItem("diafond_admin_mode", "1");
        adminStatusFilter = "ALL";
      } else {
        isAdmin = false;
        localStorage.setItem("diafond_admin_mode", "0");
        adminStatusFilter = "PUBLIC";
      }
      updateAdminUI();
      renderCatalog();
    }

    function logoutAdmin() {
      isAdmin = false;
      localStorage.setItem("diafond_admin_mode", "0");
      adminStatusFilter = "PUBLIC";
      updateAdminUI();
      renderCatalog();
    }

    function updateAdminUI() {
      const btn = document.getElementById("adminToggleBtn");
      const tabs = document.getElementById("adminStatusTabs");
      const frameActs = document.getElementById("adminFrameActions");
      const editor = document.getElementById("adminFilmEditor");

      if (isAdmin) {
        btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-600 text-white";
        btn.innerText = "🛠️ Админка: ВКЛ";
        tabs.classList.remove("hidden");
        frameActs.classList.remove("hidden");
        editor.classList.remove("hidden");
        renderStatusTabs();
      } else {
        btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-stone-800 hover:bg-stone-700 text-stone-300 border border-stone-700";
        btn.innerText = "⚙️ Управление";
        tabs.classList.add("hidden");
        frameActs.classList.add("hidden");
        editor.classList.add("hidden");
      }
    }

    function canonicalPublicStatus(st) {
      return ["restored", "done", "completed", "upscaled", "restored_paid"].includes(st);
    }

    function renderStatusTabs() {
      const counts = { ALL: allFilms.length, PUBLIC: 0 };
      allFilms.forEach(f => {
        const st = f.status || "pending";
        counts[st] = (counts[st] || 0) + 1;
        if (canonicalPublicStatus(st)) counts.PUBLIC++;
      });

      const items = [
        { id: "PUBLIC", label: `На витрине (${counts.PUBLIC})` },
        { id: "waiting_approval", label: `На проверке (${counts.waiting_approval || 0})` },
        { id: "ready_ai", label: `Готовы к ИИ (${counts.ready_ai || 0})` },
        { id: "downloaded", label: `Скачаны (${counts.downloaded || 0})` },
        { id: "pending", label: `В очереди (${counts.pending || 0})` },
        { id: "ALL", label: `Все (${counts.ALL})` }
      ];

      const box = document.getElementById("statusButtons");
      box.innerHTML = items.map(it => `
        <button onclick="setStatusFilter('${it.id}')" 
          class="px-2.5 py-1 rounded-lg text-xs font-medium transition ${adminStatusFilter === it.id ? 'bg-amber-600 text-white' : 'bg-stone-800 text-stone-300 hover:bg-stone-700'}">
          ${it.label}
        </button>
      `).join("");
    }

    function setStatusFilter(st) {
      adminStatusFilter = st;
      renderStatusTabs();
      renderCatalog();
    }

    // Выбор лучшего URL кадра по правилам архива
    function pickFrameUrl(frame, mode = "restored", preferredEngine = "auto") {
      const versions = frame.frame_versions || [];
      
      // Ищем оригинал
      const origVer = versions.find(v => v.version_type === "original") ||
                      versions.find(v => v.version_type === "nanobanana" && (v.image_url || "").includes("/originals/"));
      const origUrl = (origVer ? origVer.image_url : null) || frame.original_url || "";

      if (mode === "original") return { url: origUrl, label: "Оригинал" };

      // Ищем отреставрированные версии (не содержащие /originals/)
      const isRestoredUrl = (u) => u && !u.includes("/originals/");
      const vNano = versions.find(v => v.version_type === "nanobanana" && isRestoredUrl(v.image_url));
      const vFlux = versions.find(v => v.version_type === "flux2" && isRestoredUrl(v.image_url));
      const vUpsc = versions.find(v => v.version_type === "upscaled" && isRestoredUrl(v.image_url));

      if (preferredEngine === "nanobanana" && vNano) return { url: vNano.image_url, label: "Gemini 3.1" };
      if (preferredEngine === "flux2" && vFlux) return { url: vFlux.image_url, label: "FLUX.2" };
      if (preferredEngine === "upscaled" && vUpsc) return { url: vUpsc.image_url, label: "Upscaled" };

      // Авто-приоритет: Gemini (nanobanana_paid) -> FLUX.2 -> Upscaled -> Оригинал
      if (vNano) return { url: vNano.image_url, label: "Gemini 3.1" };
      if (vFlux) return { url: vFlux.image_url, label: "FLUX.2" };
      if (vUpsc) return { url: vUpsc.image_url, label: "Upscaled" };

      return { url: origUrl, label: "Оригинал (нет ИИ-версии)" };
    }

    // Загрузка каталога и обложек
    async function initApp() {
      updateAdminUI();
      try {
        allFilms = await sbFetch("filmstrips?select=*&order=title.asc");
        
        // Заполняем фильтр студий
        const studios = [...new Set(allFilms.map(f => f.studio).filter(Boolean))].sort();
        const stSel = document.getElementById("studioFilter");
        stSel.innerHTML = '<option value="">Все студии</option>' + studios.map(s => `<option value="${s}">${s}</option>`).join("");

        // Загружаем первые кадры (0, 1, 2, 3) для обложек одним быстрым запросом
        const coverFrames = await sbFetch("frames?select=filmstrip_id,frame_number,original_url,frame_versions(version_type,image_url)&frame_number=in.(0,1,2,3)&order=frame_number.asc");
        
        const grouped = {};
        coverFrames.forEach(fr => {
          if (!grouped[fr.filmstrip_id]) grouped[fr.filmstrip_id] = [];
          grouped[fr.filmstrip_id].push(fr);
        });

        Object.keys(grouped).forEach(fid => {
          const list = grouped[fid];
          // Сначала ищем кадр 0 с реальной реставрацией (обложка f_000.webp)
          let chosenUrl = "";
          for (const fr of list) {
            const picked = pickFrameUrl(fr, "restored", "auto");
            if (picked.url && !picked.url.includes("/originals/")) {
              chosenUrl = picked.url;
              break;
            }
          }
          // Если нет отреставрированной обложки, берем оригинал кадра 1 или 0
          if (!chosenUrl && list.length > 0) {
            const fb = list.find(x => x.frame_number === 1) || list[0];
            chosenUrl = pickFrameUrl(fb, "original").url;
          }
          coversMap[fid] = chosenUrl;
        });

        if (isAdmin) renderStatusTabs();
        renderCatalog();
      } catch (err) {
        document.getElementById("catalogStatusText").innerText = err.message;
      }
    }

    function renderCatalog() {
      const q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      const studio = document.getElementById("studioFilter").value;

      const filtered = allFilms.filter(f => {
        if (!isAdmin) {
          if (!canonicalPublicStatus(f.status)) return false;
        } else {
          if (adminStatusFilter === "PUBLIC" && !canonicalPublicStatus(f.status)) return false;
          if (adminStatusFilter !== "ALL" && adminStatusFilter !== "PUBLIC" && (f.status || "pending") !== adminStatusFilter) return false;
        }
        if (studio && f.studio !== studio) return false;
        if (q) {
          const hay = `${f.title || ""} ${f.artist || ""} ${f.author || ""} ${f.year || ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      document.getElementById("catalogStatusText").innerText = `Найдено диафильмов: ${filtered.length}`;
      const grid = document.getElementById("filmsGrid");

      grid.innerHTML = filtered.map(f => {
        const cov = coversMap[f.id] || "";
        const badgeColor = canonicalPublicStatus(f.status) ? "bg-emerald-600/90" : (f.status === "waiting_approval" ? "bg-amber-600/90" : "bg-stone-700/90");
        return `
          <div onclick="openFilm('${f.id}')" class="film-card rounded-2xl overflow-hidden cursor-pointer flex flex-col">
            <div class="frame-box relative overflow-hidden bg-stone-950">
              ${cov ? `<img src="${cov}" loading="lazy" class="w-full h-full object-cover" />` : `<div class="w-full h-full flex items-center justify-center text-stone-600 text-xs">Нет обложки</div>`}
              ${isAdmin ? `<span class="absolute top-2 right-2 px-2 py-0.5 rounded text-[10px] font-semibold text-white ${badgeColor}">${f.status || 'pending'}</span>` : ``}
              ${f.year ? `<span class="absolute bottom-2 left-2 px-2 py-0.5 rounded bg-black/75 text-[11px] text-amber-300">${f.year} г.</span>` : ``}
            </div>
            <div class="p-3.5 flex-1 flex flex-col justify-between">
              <div>
                <h3 class="font-bold text-sm line-clamp-2 text-stone-100">${f.title || "Без названия"}</h3>
                <p class="text-xs text-stone-400 mt-1 line-clamp-1">${[f.artist ? `Худ. ${f.artist}` : "", f.studio || ""].filter(Boolean).join(" • ")}</p>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // Открытие диафильма в плеере
    async function openFilm(filmId) {
      currentFilm = allFilms.find(f => f.id === filmId);
      if (!currentFilm) return;

      document.getElementById("catalogView").classList.add("hidden");
      document.getElementById("playerView").classList.remove("hidden");
      document.getElementById("playerTitle").innerText = currentFilm.title || "";
      document.getElementById("playerMeta").innerText = [
        currentFilm.year ? `${currentFilm.year} г.` : "",
        currentFilm.studio ? `Студия: ${currentFilm.studio}` : "",
        currentFilm.artist ? `Художник: ${currentFilm.artist}` : "",
        currentFilm.author ? `Автор: ${currentFilm.author}` : ""
      ].filter(Boolean).join(" • ");

      // Заполняем поля редактора для админа
      if (isAdmin) {
        document.getElementById("editStatus").value = currentFilm.status || "pending";
        document.getElementById("editArtist").value = currentFilm.artist || "";
        document.getElementById("editYear").value = currentFilm.year || "";
        document.getElementById("editCustomPrompt").value = currentFilm.custom_prompt || "";
        document.getElementById("editOriginalLink").href = currentFilm.original_url || "#";
      }

      const rawFrames = await sbFetch(`frames?filmstrip_id=eq.${filmId}&select=*,frame_versions(*)&order=frame_number.asc`);
      // Для обычных зрителей скрываем неактивные кадры (is_active === false)
      currentFrames = isAdmin ? rawFrames : rawFrames.filter(fr => fr.is_active !== false);
      currentFrameIdx = 0;
      updatePlayerFrame();
      renderThumbs();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closePlayer() {
      document.getElementById("playerView").classList.add("hidden");
      document.getElementById("catalogView").classList.remove("hidden");
    }

    function setViewMode(m) {
      viewMode = m;
      document.getElementById("btnModeRestored").className = m === "restored"
        ? "px-3 py-1 rounded-md text-xs font-semibold bg-amber-600 text-white"
        : "px-3 py-1 rounded-md text-xs font-semibold text-stone-400";
      document.getElementById("btnModeOriginal").className = m === "original"
        ? "px-3 py-1 rounded-md text-xs font-semibold bg-amber-600 text-white"
        : "px-3 py-1 rounded-md text-xs font-semibold text-stone-400";
      updatePlayerFrame();
    }

    function updatePlayerFrame() {
      if (!currentFrames.length) {
        document.getElementById("playerImg").src = "";
        document.getElementById("frameCounter").innerText = "Нет кадров";
        return;
      }
      const fr = currentFrames[currentFrameIdx];
      const engine = document.getElementById("engineSelect").value;
      const picked = pickFrameUrl(fr, viewMode, engine);

      document.getElementById("playerImg").src = picked.url;
      document.getElementById("frameCounter").innerText = `Кадр №${fr.frame_number} (${currentFrameIdx + 1} из ${currentFrames.length})`;
      document.getElementById("frameBadge").innerText = `${picked.label}${fr.is_active === false ? ' • [СКРЫТ]' : ''}`;
      highlightActiveThumb();
    }

    function prevFrame() {
      if (currentFrameIdx > 0) {
        currentFrameIdx--;
        updatePlayerFrame();
      }
    }

    function nextFrame() {
      if (currentFrameIdx < currentFrames.length - 1) {
        currentFrameIdx++;
        updatePlayerFrame();
      }
    }

    function renderThumbs() {
      const box = document.getElementById("thumbsStrip");
      box.innerHTML = currentFrames.map((fr, idx) => {
        const picked = pickFrameUrl(fr, "restored", "auto");
        return `
          <div id="thumb_${idx}" onclick=" currentFrameIdx=${idx}; updatePlayerFrame(); " 
            class="flex-shrink-0 w-20 rounded-lg overflow-hidden border-2 cursor-pointer transition ${fr.is_active === false ? 'opacity-40' : ''}">
            <div class="frame-box bg-stone-950">
              <img src="${picked.url}" loading="lazy" class="w-full h-full object-cover" />
            </div>
            <div class="text-[10px] text-center py-0.5 bg-stone-900 font-mono">#${fr.frame_number}</div>
          </div>
        `;
      }).join("");
      highlightActiveThumb();
    }

    function highlightActiveThumb() {
      currentFrames.forEach((_, idx) => {
        const el = document.getElementById(`thumb_${idx}`);
        if (el) {
          el.className = `flex-shrink-0 w-20 rounded-lg overflow-hidden border-2 cursor-pointer transition ${idx === currentFrameIdx ? 'border-amber-500 scale-105' : 'border-stone-800'}`;
        }
      });
    }

    // --- ФУНКЦИИ МОБИЛЬНОЙ АДМИНКИ ---
    async function setCurrentFrameAsCover() {
      if (!currentFrames.length) return;
      const fr = currentFrames[currentFrameIdx];
      const picked = pickFrameUrl(fr, "restored", "auto");
      const frame0 = currentFrames.find(f => f.frame_number === 0);
      if (!frame0) {
        alert("В этом диафильме нет кадра с frame_number = 0!");
        return;
      }
      try {
        await sbFetch("frame_versions?on_conflict=frame_id,version_type", {
          method: "POST",
          headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
          body: JSON.stringify({
            frame_id: frame0.id,
            version_type: "nanobanana",
            image_url: picked.url,
            version_label: `Обложка (из кадра #${fr.frame_number})`
          })
        });
        coversMap[currentFilm.id] = picked.url;
        alert(`✅ Кадр #${fr.frame_number} установлен как обложка диафильма!`);
      } catch (e) {
        alert("Ошибка: " + e.message);
      }
    }

    async function toggleCurrentFrameActive() {
      if (!currentFrames.length) return;
      const fr = currentFrames[currentFrameIdx];
      const nextVal = fr.is_active === false ? true : false;
      try {
        await sbFetch(`frames?id=eq.${fr.id}`, {
          method: "PATCH",
          body: JSON.stringify({ is_active: nextVal })
        });
        fr.is_active = nextVal;
        updatePlayerFrame();
        renderThumbs();
      } catch (e) {
        alert("Ошибка: " + e.message);
      }
    }

    async function saveFilmChanges() {
      if (!currentFilm) return;
      const payload = {
        status: document.getElementById("editStatus").value,
        artist: document.getElementById("editArtist").value.trim() || null,
        year: parseInt(document.getElementById("editYear").value) || null,
        custom_prompt: document.getElementById("editCustomPrompt").value.trim() || null
      };
      try {
        await sbFetch(`filmstrips?id=eq.${currentFilm.id}`, {
          method: "PATCH",
          body: JSON.stringify(payload)
        });
        Object.assign(currentFilm, payload);
        renderStatusTabs();
        alert("✅ Изменения сохранены в базе данных!");
      } catch (e) {
        alert("Ошибка сохранения: " + e.message);
      }
    }

    // Управление стрелками клавиатуры
    window.addEventListener("keydown", (e) => {
      if (document.getElementById("playerView").classList.contains("hidden")) return;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
      if (e.key === "ArrowRight") nextFrame();
      if (e.key === "ArrowLeft") prevFrame();
    });

    initApp();
  </script>
</body>
</html>
